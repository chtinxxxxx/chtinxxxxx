</g><circle cx="1083" cy="113" r="5" fill="none" stroke="#D1F0D2" stroke-width="2" class="bubble-a"/><circle cx="1107" cy="142" r="3" fill="none" stroke="#D1F0D2" stroke-width="1.5" class="bubble-b"/><circle cx="889" cy="202" r="4" fill="none" stroke="#D1F0D2" stroke-width="2" class="bubble-c"/><text x="848" y="265" fill="#9AB5B9" font-family="Consolas, monospace" font-size="10" >SWIM MODE // ACTIVE</text><style>@keyframes freestyleFront{0%,100%{transform:rotate(-21deg)}25%{transform:rotate(19deg)}50%{transform:rotate(65deg)}75%{transform:rotate(12deg)}}@keyframes freestyleBack{0%,100%{transform:rotate(44deg)}25%{transform:rotate(6deg)}50%{transform:rotate(-24deg)}75%{transform:rotate(8deg)}}@keyframes flutterNear{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(21deg)}}@keyframes flutterFar{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-17deg)}}@keyframes swimRoll{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(2px) rotate(2deg)}}@keyframes swimSpray{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1.08)}}.swim-bob{animation:swimRoll 1.6s ease-in-out infinite}.swim-arm-front{transform-box:fill-box;transform-origin:8% 76%;animation:freestyleFront 1.1s ease-in-out infinite}.swim-arm-back{transform-box:fill-box;transform-origin:8% 22%;animation:freestyleBack 1.1s ease-in-out infinite}.swim-kick-near{transform-box:fill-box;transform-origin:79% 50%;animation:flutterNear .52s ease-in-out infinite}.swim-kick-far{transform-box:fill-box;transform-origin:79% 25%;animation:flutterFar .52s ease-in-out infinite}.swim-spray{animation:swimSpray 1.1s ease-in-out infinite}@keyframes heroSwim{0%,100%{transform:translate(0,0) rotate(-1deg)}50%{transform:translate(5px,4px) rotate(1.6deg)}}@keyframes bubbleUp{0%,100%{transform:translateY(8px);opacity:.35}50%{transform:translateY(-9px);opacity:1}}.hero-swimmer{animation:heroSwim 5s ease-in-out infinite;transform-origin:0 0}.bubble-a{animation:bubbleUp 3s ease-in-out infinite}.bubble-b{animation:bubbleUp 3.7s ease-in-out -1s infinite}.bubble-c{animation:bubbleUp 4.2s ease-in-out -2s infinite}@media(prefers-reduced-motion:reduce){.hero-swimmer,.bubble-a,.bubble-b,.bubble-c,.swim-bob,.swim-arm-front,.swim-arm-back,.swim-kick-near,.swim-kick-far,.swim-spray{animation:none!important}}</style></svg>